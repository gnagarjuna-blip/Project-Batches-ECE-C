<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .sheet-container { background: white; padding: 40px; max-width: 900px; margin: auto; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; line-height: 1.2; margin-bottom: 20px; }
        .header h1 { font-size: 20px; margin: 5px; text-transform: uppercase; }
        .header h2 { font-size: 16px; margin: 5px; font-weight: normal; }
        .coord-line { margin: 20px 0; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; font-size: 13px; }
        th { background-color: #e8e8e8; text-transform: uppercase; }
        
        .form-group { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 5px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; }
        
        button { background-color: #0056b3; color: white; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #004494; }
        .success { color: green; font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="sheet-container">
    <div class="header">
        <h1>Bharat Institute of Engineering and Technology</h1>
        <h2>Department of ECE</h2>
        <h2>Mini Project Batches List (Academic Year 2025-26)</h2>
    </div>

    <div class="coord-line">
        Class Incharge: G. Nagarjuna
    </div>

    <form id="batchForm">
        <div class="form-group">
            <label>Select Your Batch Number:</label>
            <select name="batchNo" required>
                <option value="">-- Select Batch (1 to 17) --</option>
                <script>
                    for(let i=1; i<=17; i++) document.write(`<option value="Batch-${i}">Batch-${i}</option>`);
                </script>
            </select>
        </div>

        <div class="form-group">
            <label>Project Details:</label>
            <input type="text" name="guide" placeholder="Name of the Guide" required>
            <input type="text" name="title" placeholder="Title of the Project" required>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Member</th>
                    <th>Roll Number</th>
                    <th>Name of the Student</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td><input type="text" name="roll1" required></td><td><input type="text" name="name1" required></td></tr>
                <tr><td>2</td><td><input type="text" name="roll2" required></td><td><input type="text" name="name2" required></td></tr>
                <tr><td>3</td><td><input type="text" name="roll3" required></td><td><input type="text" name="name3" required></td></tr>
                <tr><td>4</td><td><input type="text" name="roll4" required></td><td><input type="text" name="name4" required></td></tr>
            </tbody>
        </table>

        <br>
        <button type="submit" id="submitBtn">Submit Batch Details</button>
    </form>
    <div id="msg" class="success">Details submitted successfully! This will appear in the coordinator's Sheet.</div>
</div>

<script>
    const form = document.getElementById('batchForm');
    form.onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerHTML = "Sending...";
        
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        // This links to the Google Script backend
        google.script.run.withSuccessHandler(() => {
            form.style.display = 'none';
            document.getElementById('msg').style.display = 'block';
        }).processForm(data);
    };
</script>

</body>
</html>
