<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Module Portal</title>
    <style>
        :root {
            --primary-bg: #1e1e24;
            --secondary-bg: #2a2a35;
            --accent-blue: #4a90e2;
            --accent-green: #2ecc71;
            --text-light: #f5f6fa;
            --text-dim: #a4b0be;
            --border-dark: #3d3d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========================================================
           [PASTE YOUR EXACT LOGIN SCREEN CSS MODEL BELOW]
           ======================================================== */
        #login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-bg);
        }

        .login-box {
            background-color: var(--secondary-bg);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-dark);
        }

        .login-box h2 {
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-light);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            color: var(--text-light);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        /* ======================================================== */

        /* --- DASHBOARD LAYOUT --- */
        #dashboard-container {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        header {
            background-color: var(--secondary-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dark);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        /* --- SIDEBAR TRACKS --- */
        .sidebar {
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-weight: bold;
        }

        .day-tab {
            background-color: var(--primary-bg);
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-tab.active {
            border-color: var(--accent-blue);
            background-color: rgba(74, 144, 226, 0.1);
        }

        .day-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background-color: #121216;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* --- WORKSPACE & CARDS --- */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-scroller {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scenario-card {
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            padding: 25px;
            position: relative;
        }

        .scenario-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 12px;
        }

        .scenario-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-light);
            background-color: var(--primary-bg);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent-blue);
        }

        /* Interactive Inputs & Submit Engine */
        .trainee-box-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .trainee-input {
            width: 100%;
            height: calc(6 * 1.5em + 24px); /* Fixed 6 lines of standard text sizing height */
            background-color: var(--primary-bg);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            color: var(--text-light);
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            margin-bottom: 12px;
        }

        .trainee-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .brief-requirement-box {
            background-color: #1a2536;
            border: 1px dashed #34495e;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #b4c4d4;
            margin-bottom: 15px;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .submit-indicator {
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .submit-indicator.saved {
            color: var(--accent-green);
            display: inline-block;
        }

        .q-submit-btn {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .q-submit-btn:hover {
            background-color: var(--accent-blue);
        }

        .q-submit-btn.submitted-state {
            background-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div id="login-container">
        <div class="login-box">
            <h2>Training Portal Sign-In</h2>
            <form id="login-form" onsubmit="executeAuth(event)">
                <div class="input-group">
                    <label>Operator/Trainee ID</label>
                    <input type="text" id="username" placeholder="e.g., trainee_sre" required value="trainee_sre">
                </div>
                <div class="input-group">
                    <label>Security Key Token</label>
                    <input type="password" id="password" placeholder="••••••••" required value="password123">
                </div>
                <button type="submit" class="login-btn">Initialize Training Run</button>
            </form>
        </div>
    </div>
    <div id="dashboard-container">
        <header>
            <h3>Operational Diagnostic Hub & Sandbox</h3>
            <div id="trainee-badge" style="color: var(--text-dim); font-size: 14px;">Trainee: ID</div>
        </header>

        <div class="main-layout">
            <div class="sidebar">
                <div class="sidebar-title">Training Tracks</div>
                
                <div class="day-tab active" id="tab-day7" onclick="switchDayTrack(7)">
                    <div class="day-info">
                        <span>Day 7 (Catalog)</span>
                        <span id="percent-day7">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-day7"></div>
                    </div>
                </div>

                <div class="day-tab" id="tab-day8" onclick="switchDayTrack(8)">
                    <div class="day-info">
                        <span>Day 8 (Infra)</span>
                        <span id="percent-day8">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-day8"></div>
                    </div>
                </div>

                <div class="day-tab" id="tab-day9" onclick="switchDayTrack(9)">
                    <div class="day-info">
                        <span>Day 9 (Advanced)</span>
                        <span id="percent-day9">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="bar-day9"></div>
                    </div>
                </div>
            </div>

            <div class="workspace">
                <div class="card-scroller" id="scroller-viewport"></div>
            </div>
        </div>
    </div>

    <script>
        let activeDayTrack = 7;
        let traineeSubmissions = {};
        let permanentSubmittedFlags = {};

        // 1 to 80 Global Dataset
        const comprehensiveTrainingCatalog = [
            // --- DAY 7 WORKSPACE PORTFOLIOS (IDs 1 - 25) ---
            { id: 1, day: 7, title: "Scenario 1: Detail Page Hijacking via Vendor Central Feed Override", desc: "An automated alert confirms a high-severity classification override anomaly on ASIN B00X1001FF. A legacy Vendor Central payload successfully modified critical brand parameters and product titles.", requirement: "Provide localized attribute cleanup methods and override validation steps." },
            { id: 2, day: 7, title: "Scenario 2: Parent-Child Variation Abuse (ASIN Twisting for Reviews)", desc: "A bad actor has nested multiple unrelated mobile cases as alternate color configurations under a top-ranked consumer electronics parent node to inherit its baseline visibility matrix.", requirement: "Dismantle variation structures and isolate data profiles." },
            { id: 3, day: 7, title: "Scenario 3: Restricted Products Infringement via Character Manipulation", desc: "A health supplement manufacturer utilizes look-alike Cyrillic symbols and mixed character payloads inside its backend bullet description maps to conceal a prohibited prescription compound.", requirement: "Apply global parameters blocks and design string validation models." },
            { id: 4, day: 7, title: "Scenario 4: Brand Registry Counterfeit Loop Exception", desc: "An automated counterfeit rules script is stuck in an infinite processing loop, continuously suppressing a premium electronics catalog listing owned by an authorized distributor.", requirement: "Establish explicit distributor exclusion mappings and flush state locks." },
            { id: 5, day: 7, title: "Scenario 5: Dangerous Goods (Hazmat) Energy Density Classification Fault", desc: "During intake staging at a fulfillment hub, automated scanners identify high-density lithium-ion battery arrays inside product stock. The catalog profile lists this item as unpowered.", requirement: "Reclassify product groups and assign transit containment holds." },
            { id: 6, day: 7, title: "Scenario 6: Global Category (GL String) Mapping Matrix Corruptions", desc: "An enterprise listing batch update maps thousands of heavy automotive powertrain assemblies under the 'Grocery & Gourmet Food' category hierarchy.", requirement: "Force target reassignments via clean batch upload configurations." },
            { id: 7, day: 7, title: "Scenario 7: High-Frequency Duplicate ASIN Inflation Loop", desc: "A malicious vendor modifies standard barcode digits and UPC prefixes to bypass catalog duplication filters, generating 4,000 distinct single pages for an identical household item.", requirement: "Apply structural duplication collapse arrays and discard temporary nodes." },
            { id: 8, day: 7, title: "Scenario 8: Trademark Exploitation via Hidden Attribute Injection", desc: "A third-party apparel vendor injects trademarked high-end competitor keywords into hidden catalog metadata fields and search term attributes to redirect traffic routes.", requirement: "Purge matching keywords arrays and lower contribution weight ranks." },
            { id: 9, day: 7, title: "Scenario 9: Cross-Marketplace Decimal Conversion Anomaly", desc: "A technical glitch inside an automated multi-currency catalog syncing pipeline misplaces a currency decimal point during localized conversions, dropping value targets by 99%.", requirement: "Trigger cross-marketplace valuation blocks and drop erratic open sales pipelines." },
            { id: 10, day: 7, title: "Scenario 10: High-Priority Regulatory Product Safety Recall", desc: "A government oversight agency issues an immediate recall directive for a specific children's toy model due to critical manufacturing structural failures.", requirement: "Deploy comprehensive family blocks and clear physical distribution lots." },
            { id: 11, day: 7, title: "Scenario 11: Gray Market Parallel Import Verification Failure", desc: "An international trade broker imports electronic equipment variants into a territory lacking local warranty certification, falsely editing descriptions to claim local coverage.", requirement: "Enforce localization notice indicators and scrub missing service strings." },
            { id: 12, day: 7, title: "Scenario 12: Legacy Ingestion Asset Link Hijacking", desc: "An inactive, expired wholesale merchant account leverages a vulnerability in an unpatched legacy file bridge to upload low-quality images to high-traffic fashion catalog nodes.", requirement: "Revert asset endpoints to secure storage frames and cut legacy channels." },
            { id: 13, day: 7, title: "Scenario 13: Luxury Distribution Authorization Tampering", desc: "An unauthorized reselling network modifies catalog layout records for a premium cosmetics brand to erase regulatory tracking information from photography assets.", requirement: "Restrict listing access to verified Tier-1 credentials groups explicitly." },
            { id: 14, day: 7, title: "Scenario 14: Historical Review Profile Merging Corruption", desc: "A catalog consolidation utility incorrectly joins database profiles for two distinct generations of an industrial tool, blending excellent reviews with high failure ratings.", requirement: "Dismantle database configurations using transaction timestamps arrays." },
            { id: 15, day: 7, title: "Scenario 15: Rapid Synthetic Review Injection Fraud", desc: "A cluster of newly registered buyer profiles originating from single network coordinates generates thousands of unverified high-tier reviews within 15 minutes.", requirement: "Apply processing review blocks and flag account pathways for analytical reviews." },
            { id: 16, day: 7, title: "Scenario 16: Perishable Product Lifecycle Catalog Defect", desc: "Perishable items experience high customer complaints due to rapid expiration tracking failures. The baseline catalog profile lacks a required declaration variable.", requirement: "Inject required tracking lifecycle schemas into automated processing paths." },
            { id: 17, day: 7, title: "Scenario 17: Search Index Block via Malformed Document Formatting", desc: "A merchant injects dense blocks of prohibited promotional text and raw unescaped HTML scripts into product bullet fields, breaking layouts.", requirement: "Parse text blocks, wipe styling structures, and force index scans." },
            { id: 18, day: 7, title: "Scenario 18: Dimensions Manipulation for Fee Evasion", desc: "A merchant alters the unit weight configuration maps for a heavy product from pounds to ounces, artificially evading high-tier fulfillment fees.", requirement: "Lock parameters targets via weight diagnostics and charge balances." },
            { id: 19, day: 7, title: "Scenario 19: Broad Automation Counterfeit False Positive Mitigation", desc: "An aggressive security automation rule incorrectly flags a new official seasonal product launch as an unverified counterfeit vector, immediately suppressing the catalog listing.", requirement: "Re-verify authentication credentials and tune rule processing profiles." },
            { id: 20, day: 7, title: "Scenario 20: Misinterpreted Terminology Product Suppression Anomaly", desc: "Natural organic textile items are blocked by automatic compliance parsers under federal pesticide laws because the catalog text contains the descriptive term 'insect-resistant'.", requirement: "Validate classification parameters manually and override false pesticide metrics." },
            { id: 21, day: 7, title: "Challenge 21: High-Volume Cross-Border ASIN Contamination Remediation", desc: "A rogue seller token has injected malicious translated content across multiple European marketplace languages for a single parent ASIN, causing cross-border listing blocks.", requirement: "Provide localized attribute cleanup methods and cross-marketplace synchronization locks." },
            { id: 22, day: 7, title: "Challenge 22: Algorithmic Price-Gouging False Positive Mitigation", desc: "During an emergency crisis event, a critical safety product is falsely suppressed globally by price-gouging algorithms because a legitimate wholesale cost update was flagged.", requirement: "Detail historical cost basis data validations and algorithmic override conditions." },
            { id: 23, day: 7, title: "Challenge 23: Systematic Variation Shadow Hijacking Identification", desc: "Sophisticated malicious accounts are creating orphaned child listings under expired legacy UPCs, filling them with fake reviews, and then using parent variations to sneak them.", requirement: "Outline parent-child trace mapping audits and absolute deletion protocols." },
            { id: 24, day: 7, title: "Challenge 24: Distributed Brand Sabotage Campaign Defusal", desc: "Dozens of throwaway seller accounts are launching coordinated daily attacks against a high-profile electronics brand listing by submitting daily flat-files containing contradictory dimensions.", requirement: "Design a permanent contribution lock structure and metadata authority parameters." },
            { id: 25, day: 7, title: "Challenge 25: Fragmented Global Catalog Architecture Migration", desc: "Due to legacy company acquisitions, a core brand profile is fragmented across three separate structural database entities, leading to continuous feed synchronization corruptions.", requirement: "Draft a data reconciliation plan for target baseline normalization." },

            // --- DAY 8 INTERACTIVE TRACKS (IDs 26 - 50) ---
            { id: 26, day: 8, title: "Problem: Severity-1 Ticket Queue Overlap Optimization", desc: "A broken notification loop triggers thousands of duplicate ticketing records inside active engineering priority boards. On-call support staff are missing critical edge failures.", requirement: "Apply dynamic deduplication sorting parameters using regex filters and suppress secondary noise profiles." },
            { id: 27, day: 8, title: "Incident: Cross-Regional Escalation Route Failure", desc: "A critical router degradation delays severity incident notes from passing smoothly into target support teams across geographic timezones.", requirement: "Establish secondary out-of-band communication loops across alternative messaging channels." },
            { id: 28, day: 8, title: "Challenge: Cloud Storage Rate Limiting Throttle", desc: "An unexpected batch-processing job rapidly exhausts object storage API read quotas, causing dependent user-facing application services to receive HTTP 429 errors.", requirement: "Implement exponential backoff algorithms with jitter and a Redis caching layer configuration." },
            { id: 29, day: 8, title: "Incident: Production Database Write Deadlock Cascade", desc: "Simultaneous high-volume updates to a legacy accounting database table trigger a severe transactional deadlock. Main database threads become exhausted.", requirement: "Detail the criteria for terminating blocking PID threads and executing row locking limits." },
            { id: 30, day: 8, title: "Problem: Stale CI/CD Pipeline Artifact State Lockout", desc: "A corrupted runner state file prevents automated deployment pipelines from reading newly compiled binaries. Engineers are blocked from deploying urgent security hotfixes.", requirement: "Clear runner cache volumes and define isolated tracking variables configuration." },
            { id: 31, day: 8, title: "Incident: Expired SSL/TLS Root Certificate Chain Break", desc: "An unmonitored intermediary CA root certificate expires unexpectedly, throwing invalid security handshake errors across legacy client devices attempting to connect.", requirement: "Deploy updated configurations containing current anchors and launch automated synthetic lifecycle checks." },
            { id: 32, day: 8, title: "Challenge: Asymmetric Routing over Hybrid Cloud VPN", desc: "Following a scheduled data center network migration, outbound packets route through an on-premises gateway while inbound packets return via a public cloud internet gateway.", requirement: "Adjust BGP multi-exit discriminator (MED) attributes and modify autonomous system path prepending." },
            { id: 33, day: 8, title: "Problem: Microservice Service Mesh Sidecar Memory Exhaustion", desc: "An uncontrolled telemetry tracking log configuration causes sidecar proxy containers to consume excessive memory resources, triggering automated Kubernetes OOMKilled events.", requirement: "Tune down telemetry logging verbosity levels and adjust memory resource limits in daemonset templates." },
            { id: 34, day: 8, title: "Incident: Content Delivery Network (CDN) Cache Stampede", desc: "A high-traffic home page asset cache expires concurrently. Millions of incoming user queries bypass the edge server edge and hit the origin infrastructure simultaneously.", requirement: "Configure background revalidation flags (stale-while-revalidate) and gateway distributed mutex locks." },
            { id: 35, day: 8, title: "Challenge: StatefulSet Persistent Volume Space Depletion", desc: "An unexpected telemetry logging surge fills up a stateful analytical database node's underlying persistent volume disk, corrupting local log indices.", requirement: "Expand claims via hot-resize definitions and apply transactional retention script purges." },
            { id: 36, day: 8, title: "Problem: Identity Provider (IdP) Clock Drift Token Invalidation", desc: "System clock drift across a subset of virtual machine hosts causes internal security assertion tokens to be generated with mismatched timestamps.", requirement: "Force-synchronize nodes with upstream NTP pools and configure automated notification cron jobs." },
            { id: 37, day: 8, title: "Incident: Third-Party Webhook Drop and Payload Loss", desc: "A payment gateway vendor experiences an outage and drops real-time status webhooks. Internal customer fulfillment systems fail to receive order updates.", requirement: "Build manual event reconciliation script mechanisms and automated fallback polling loops." },
            { id: 38, day: 8, title: "Challenge: Rogue Kafka Consumer Unbalanced Partition Lag", desc: "A poorly optimized application code change causes one consumer group thread to block on a database write loop, triggering massive partition message lag.", requirement: "Rebalance topic parameters, scale pod metrics, and describe application code rollbacks." },
            { id: 39, day: 8, title: "Problem: Infrastructure-as-Code State File Concurrency Conflict", desc: "Two distinct automation pipelines trigger simultaneous terraform deployment workflows on identical environments, corrupting the shared remote state lock file.", requirement: "Detail state lock releasing protocols and workspace isolation setups within orchestration layers." },
            { id: 40, day: 8, title: "Incident: DNS Cache Poisoning and Propagation Latency", desc: "An unauthorized domain configuration modification points user traffic toward malicious proxy servers. While fixed quickly at the registrar level, regional ISP resolvers continue caching.", requirement: "Issue targeted cache eviction routines to global providers and adjust operational TTL properties." },
            { id: 41, day: 8, title: "Challenge: Secret Rotation Sync Lag across Remote Clusters", desc: "An automated vault platform rotates API key credentials, but a downstream staging cluster fails to refresh its environment variables.", requirement: "Trigger on-demand validation webhooks and deploy dynamic sidecar injectors for reading." },
            { id: 42, day: 8, title: "Problem: Log Aggregator Buffer Overflow Data Loss", desc: "A sudden application error storm triggers excessive logging output that completely overwhelms local logging daemon memory buffer queues.", requirement: "Configure local disk-backed buffers and establish dynamic rate-limiting filtering parameters." },
            { id: 43, day: 8, title: "Incident: Auto-Scaling Group Resource Ceiling Exhaustion", desc: "An unprecedented traffic wave maximizes the configuration scaling ceiling of a main cluster node pool. Cloud provider regional subnets are exhausted.", requirement: "Adjust scaling directions to alternative available zones and provision temporary spot fleets." },
            { id: 44, day: 8, title: "Challenge: Edge Proxy CORS Configuration Drift", desc: "An uncoordinated configuration change to the edge API gateway drops essential Cross-Origin Resource Sharing header elements.", requirement: "Roll back gateway state configurations and write automated pipeline testing validation cases." },
            { id: 45, day: 8, title: "Problem: Message Queue Dead Letter Queue (DLQ) Silent Accumulation", desc: "A subtly malformed event schema payload passes early validation checks but fails processing logic, continuously accumulating millions of items.", requirement: "Write bad parsing scripts, re-inject valid events, and build deep queue threshold alerts." },
            { id: 46, day: 8, title: "Incident: Multi-Tenant Resource Starvation on Shared Kubernetes Node", desc: "A non-production container service experiences a memory leak and circumvents its namespace enforcement definitions, consuming host resources.", requirement: "Isolate/evict containers and design strict ResourceQuotas and LimitRanges constraints." },
            { id: 47, day: 8, title: "Challenge: Flaky Integration Test Suites Blocking Emergency Patches", desc: "A series of race conditions inside legacy automated API integration tests cause intermittent build pipeline failures, delaying a critical hotfix deployment.", requirement: "Bypass non-critical paths with explicit flags and write asynchronous test isolation setups." },
            { id: 48, day: 8, title: "Problem: Database Read-Replica Lag Causing UI Inconsistencies", desc: "Heavy batch indexing operations overload primary read-replicas, resulting in data synchronization replication lag.", requirement: "Re-route critical reads to primary master and increase parallel replication worker counts." },
            { id: 49, day: 8, title: "Incident: API Gateway Rate-Limiter Failure Bypass Exploitation", desc: "An edge-case payload parsing defect causes the API gateway to skip rate-limiting validations whenever specific header patterns are present.", requirement: "Deploy emergency regex blocks at firewall layers and update authorization filters definitions." },
            { id: 50, day: 8, title: "Incident: BGP Route Flapping Disconnecting Hybrid Link", desc: "Intermittent physical hardware faults at a carrier's routing facility trigger rapid, continuous Border Gateway Protocol path updates.", requirement: "Activate BGP route flap dampening parameters and shift workflows over to backup transport tunnels." },

            // --- DAY 9 ADVANCED CLUSTER SERVING LAYERS (IDs 51 - 80) ---
            { id: 51, day: 9, title: "Problem: Distributed Tracing Context Propagation Breakage", desc: "An updated HTTP client library drops internal W3C trace context headers during outbound asynchronous service calls.", requirement: "Outline trace injection mapping methods, runtime interception hooks, and context validations." },
            { id: 52, day: 9, title: "Incident: Zookeeper Quorum Loss Triggers Kafka Outage", desc: "Intermittent network partitions isolate two out of five nodes in a state management cluster, dropping it below quorum threshold.", requirement: "Formulate state loop purge commands, node connection tracking, and mapping overrides." },
            { id: 53, day: 9, title: "Challenge: Container Image Registry Storage Quota Exhaustion", desc: "An unmonitored development pipeline builds thousands of daily snapshot container images without cleaning them up.", requirement: "Outline image tag cleanup rules, storage array scaling, and build cycle retention matrices." },
            { id: 54, day: 9, title: "Problem: DNS Latency Spike via High Local Cache Eviction", desc: "Core application containers request domain resolutions for every internal transaction due to a low local cache setting.", requirement: "Design daemonset mapping controls, application caching, and TTL lifecycle alterations." },
            { id: 55, day: 9, title: "Incident: Elasticsearch Unassigned Shards and Cluster Yellow State", desc: "An unexpected hardware failure on a primary data node drops multiple primary database shards.", requirement: "Detail cluster reroute syntax, shard rebalancing commands, and watermarking updates." },
            { id: 56, day: 9, title: "Challenge: OAuth2 Refresh Token Expiration Wave", desc: "A legacy database migration accidentally resets expiration timestamps on thousands of active refresh tokens.", requirement: "Design temporary signature bypass routines, phased re-authentication, and validation maps." },
            { id: 57, day: 9, title: "Problem: Linux Kernel Out-of-Memory (OOM) Killer Host Freeze", desc: "An unconstrained database backup script consumes host memory resources outside the container engine's boundary.", requirement: "Detail systemd configuration tracking, OOM score tuning, and execution memory limits." },
            { id: 58, day: 9, title: "Incident: Redis Replication Link Buffer Overflow", desc: "A massive influx of data writes overflows the Redis client output buffer allocated for replica synchronization.", requirement: "Detail replication output buffer expansion steps, multi-replica scaling strategies, and cluster write mitigation protocols." },
            { id: 59, day: 9, title: "Challenge: Stale Feature Flag Evaluation Drift", desc: "A deprecated feature flag is removed from the central management platform but remains embedded inside legacy service code.", requirement: "Formulate explicit emergency injection rules, code analysis verification pipelines, and runtime overrides." },
            { id: 60, day: 9, title: "Problem: Object Storage Bucket Policy Overwrite Lockout", desc: "An infrastructure-as-code template deployment pushes a malformed IAM policy that removes administrative access rights from a primary asset bucket.", requirement: "Outline root privilege bypass routes, policy state restoration scripts, and access control templates." },
            { id: 61, day: 9, title: "Incident: Kubernetes API Server Request Thread Starvation", desc: "A poorly written internal monitoring tool queries the Kubernetes API server for pod metrics every few milliseconds.", requirement: "Outline ingress throttling, informer pattern logic integration, and connection blocking metrics." },
            { id: 62, day: 9, title: "Challenge: Database Connection Pool Starvation via Long Queries", desc: "An unoptimized analytical query locks up several application database connections for minutes, starving web transactional requests.", requirement: "Configure pool timeouts, pool isolation topologies, and statements execution parameters." },
            { id: 63, day: 9, title: "Problem: Ingress Gateway SNI Routing Mismatch", desc: "A typo in an edge proxy routing map causes TLS Server Name Indication (SNI) configurations to fail.", requirement: "Propose SNI verification tests, multi-domain edge fallback maps, and routing rules patches." },
            { id: 64, day: 9, title: "Incident: Microservice Memory Leak via Unclosed File Descriptors", desc: "A corrupted logging library does not close operating system file handles on error events. Containers hit OS open-file allocation limits.", requirement: "Detail file description tracking loops, runtime context drops, and pool recycling hooks." },
            { id: 65, day: 9, title: "Challenge: Distributed Lock Expiration Race Condition", desc: "A high-performance calculation job hits processing delays. Its shared Redis lock expires before processing completes.", requirement: "Design dynamic lock extending daemons, transaction fencing tokens, and conditional database updates." },
            { id: 66, day: 9, title: "Problem: Kernel TCP Window Size Auto-Tuning Freeze", desc: "Under extreme packet volumes, an operating system auto-tuning bug drops the socket socket receive buffer allocation down to zero bytes.", requirement: "Detail system control parameters adjustments, explicit window thresholds, and network stack resets." },
            { id: 67, day: 9, title: "Incident: Shared Filesystem Metadata Lock Contention", desc: "Thousands of server processes simultaneously write tracking data records into a single mounted network folder.", requirement: "Formulate path allocation logic, partition distribution strategies, and buffer caching maps." },
            { id: 68, day: 9, title: "Challenge: Multi-Cloud Replication Link Encryption Overhead", desc: "Enabling strict IPSec tunnels for database streaming operations between distinct public clouds spikes CPU consumption across networking instances.", requirement: "Propose network infrastructure hardware offloading, accelerated encryption layer setups, and routing updates." },
            { id: 69, day: 9, title: "Problem: Configuration Management Daemon State Drift", desc: "An automated maintenance routine updates software libraries on standalone compute modules without matching central configuration records.", requirement: "Formulate drift tracking automation, immutability image generation layouts, and baseline validations." },
            { id: 70, day: 9, title: "Incident: Graph Database Index Corruption during Live Split", desc: "A structural node replication sequence hits a cluster networking split. Local relational graphs corrupt their memory maps.", requirement: "Detail graph indexing verification scripts, snapshot restoration routines, and database consistency validations." },
            { id: 71, day: 9, title: "Challenge: Serverless Ingress Timeout on Long API Processing", desc: "An analytics processing request exceeds the maximum 30-second gateway execution rule set by a serverless computing provider.", requirement: "Design asynchronous execution routing matrices, task tracking tokens, and event polling mechanics." },
            { id: 72, day: 9, title: "Problem: Broken Reverse Proxy Keep-Alive Connection Pool", desc: "A faulty configuration drops connection caching states between downstream load balancers and upstream servers.", requirement: "Proxy connection parameters tuning, keep-alive variable definitions, and socket allocation adjustments." },
            { id: 73, day: 9, title: "Incident: Message Broker Disk High-Watermark Enforcements", desc: "An analytical stream engine fills up local storage arrays past the 90% hard threshold. The message system enters a defensive protection mode.", requirement: "Propose storage expansion routines, immediate log purging schemas, and queue publisher throttling." },
            { id: 74, day: 9, title: "Challenge: Container Runtime Storage Overlay Extinction", desc: "A misconfigured background logging container dumps system tracing events directly into its ephemeral container image layer instead of a mounted path.", requirement: "Formulate container disk space cleanups, volume mounting rules, and log file size restrictions." },
            { id: 75, day: 9, title: "Problem: App Server Memory Fragmentation via Large Allocation Matrix", desc: "A high-tier analytics application allocates and discards large memory structures repeatedly. While total system memory is sufficient, extreme memory fragmentation causes next allocation steps to fail.", requirement: "Propose garbage collector tuning scripts, pre-allocated memory pool setups, and process cycling rules." },
            { id: 76, day: 9, title: "Incident: BGP Route Leak Blackholing Enterprise Traffic", desc: "An downstream networking vendor accidentally announces local enterprise IP networks to global carrier channels, misrouting vast portions of user traffic.", requirement: "Outline upstream filtering rules, autonomous systems tracking updates, and prefix verification adjustments." },
            { id: 77, day: 9, title: "Challenge: API Response Serialization CPU Spike", desc: "A broad database query generates deep nested structures for a core microservice. Transforming these objects into large JSON outputs spikes node CPU metrics to 100%.", requirement: "Propose streaming serialization layers, pagination parameters, and caching implementations." },
            { id: 78, day: 9, title: "Problem: Broken Service Mesh TLS Mutual Authentication Handshake", desc: "An internal certificate rotation failure pushes invalid certificate strings to microservices sidecars.", requirement: "Detail control plane certificate synchronization steps, trust chain updates, and validation fallbacks." },
            { id: 79, day: 9, title: "Incident: Microservice Distributed Storage Lock Split-Brain", desc: "A long multi-datacenter network timeout causes two isolated metadata instances to assume the master processing role simultaneously.", requirement: "Formulate split-brain reconciliation protocols, state consensus checks, and vector timestamp processing." },
            { id: 80, day: 9, title: "Incident: High-Frequency Database Lock Escalation Anomaly", desc: "A batch data update crosses internal row lock allocation limits within a main relational database table, causing engines to escalate to a single hard table-level lock.", requirement: "Detail chunked transaction configurations, index tracking rules updates, and query optimization setups." }
        ];

        // Self-Executing Initialization Lifecycle Core
        window.addEventListener('DOMContentLoaded', () => {
            // Restore local storage engine data strings
            const savedData = localStorage.getItem('trainee_submissions');
            const savedFlags = localStorage.getItem('permanent_submitted_flags');
            
            if (savedData) traineeSubmissions = JSON.parse(savedData);
            if (savedFlags) permanentSubmittedFlags = JSON.parse(savedFlags);
            
            // Execute calculated percentage tracking visually immediately on refresh initialization
            calculateMetrics();
        });

        // Authorization Matrix Routing Sequence
        function executeAuth(e) {
            e.preventDefault();
            const operator = document.getElementById('username').value;
            document.getElementById('trainee-badge').innerText = `Trainee ID: ${operator}`;
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'flex';
            
            renderActiveDayContent();
        }

        // Segment Switcher Engine
        function switchDayTrack(day) {
            activeDayTrack = day;
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-day${day}`).classList.add('active');
            renderActiveDayContent();
        }

        // Commit execution logic for questions individual actions
        function fireQuestionSubmit(qId) {
            const textareaInput = document.getElementById(`text-area-node-${qId}`);
            const inputVal = textareaInput ? textareaInput.value : "";

            if (inputVal.trim() === "") {
                alert("Please type out a solution before clicking submit.");
                return;
            }

            // Bind explicitly to persistent objects
            traineeSubmissions[qId] = inputVal;
            permanentSubmittedFlags[qId] = true;

            // Save records array securely across state changes
            localStorage.setItem('trainee_submissions', JSON.stringify(traineeSubmissions));
            localStorage.setItem('permanent_submitted_flags', JSON.stringify(permanentSubmittedFlags));

            // Inform the UI
            const dynamicIndicator = document.getElementById(`saved-indicator-${qId}`);
            const submitButtonNode = document.getElementById(`btn-node-${qId}`);
            
            if (dynamicIndicator) {
                dynamicIndicator.className = "submit-indicator saved";
                dynamicIndicator.innerText = "Submitted successfully!";
            }
            if (submitButtonNode) {
                submitButtonNode.classList.add('submitted-state');
                submitButtonNode.innerText = "Re-Submit Response";
            }

            // Recalculate track metrics
            calculateMetrics();
        }

        // Primary Structural Scroller Render Loop
        function renderActiveDayContent() {
            const viewport = document.getElementById('scroller-viewport');
            viewport.innerHTML = '';

            const activeScenarios = comprehensiveTrainingCatalog.filter(q => q.day === activeDayTrack);

            activeScenarios.forEach((q) => {
                const card = document.createElement('div');
                card.className = 'scenario-card';

                const title = document.createElement('div');
                title.className = 'scenario-title';
                title.innerText = `Task ID #${q.id}: ${q.title}`;
                card.appendChild(title);

                const desc = document.createElement('div');
                desc.className = 'scenario-desc';
                desc.innerText = q.desc;
                card.appendChild(desc);

                const boxLabel = document.createElement('div');
                boxLabel.className = 'trainee-box-label';
                boxLabel.innerText = "Trainee Proposed Mitigation Solution (6 Lines)";
                card.appendChild(boxLabel);

                // Instantiated text area node with strict vertical height bounds
                const textarea = document.createElement('textarea');
                textarea.id = `text-area-node-${q.id}`;
                textarea.className = 'trainee-input';
                textarea.placeholder = "Formulate your operational response sequence here...";
                textarea.value = traineeSubmissions[q.id] || "";
                
                // Track typing changes locally dynamically
                textarea.oninput = (e) => {
                    traineeSubmissions[q.id] = e.target.value;
                    localStorage.setItem('trainee_submissions', JSON.stringify(traineeSubmissions));
                };
                card.appendChild(textarea);

                const requirementBox = document.createElement('div');
                requirementBox.className = 'brief-requirement-box';
                requirementBox.innerHTML = `<strong>Required Criteria:</strong> ${q.requirement}`;
                card.appendChild(requirementBox);

                // Action Controls Layout Row
                const actionRow = document.createElement('div');
                actionRow.className = 'action-row';

                const hasBeenSubmitted = permanentSubmittedFlags[q.id] === true;

                const indicator = document.createElement('span');
                indicator.id = `saved-indicator-${q.id}`;
                indicator.className = hasBeenSubmitted ? 'submit-indicator saved' : 'submit-indicator';
                indicator.innerText = hasBeenSubmitted ? "Submitted successfully!" : "";
                actionRow.appendChild(indicator);

                const submitBtn = document.createElement('button');
                submitBtn.id = `btn-node-${q.id}`;
                submitBtn.className = hasBeenSubmitted ? 'q-submit-btn submitted-state' : 'q-submit-btn';
                submitBtn.innerText = hasBeenSubmitted ? "Re-Submit Response" : "Submit Answer";
                submitBtn.onclick = () => fireQuestionSubmit(q.id);
                actionRow.appendChild(submitBtn);

                card.appendChild(actionRow);
                viewport.appendChild(card);
            });
        }

        // Dynamic Submission Percentage Tracking Engine
        function calculateMetrics() {
            const tracks = [7, 8, 9];

            tracks.forEach(day => {
                const targetedGroup = comprehensiveTrainingCatalog.filter(q => q.day === day);
                const totalItemsCount = targetedGroup.length;
                let verifiedSubmissionsCount = 0;

                targetedGroup.forEach(q => {
                    // Only count toward percentage if the explicit submit actions occurred
                    if (permanentSubmittedFlags[q.id] === true && traineeSubmissions[q.id] && traineeSubmissions[q.id].trim() !== "") {
                        verifiedSubmissionsCount++;
                    }
                });

                const percentageValue = totalItemsCount > 0 ? Math.round((verifiedSubmissionsCount / totalItemsCount) * 100) : 0;
                
                // Update target sidebar element displays
                const textPercent = document.getElementById(`percent-day${day}`);
                const fluidBar = document.getElementById(`bar-day${day}`);
                
                if (textPercent) textPercent.innerText = `${percentageValue}%`;
                if (fluidBar) fluidBar.style.width = `${percentageValue}%`;
            });
        }
    </script>
</body>
</html>
