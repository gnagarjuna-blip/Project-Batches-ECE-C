<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE Project Batch Entry</title>
    <style>
        body { font-family: "Times New Roman", Times, serif; background-color: #f0f0f0; padding: 20px; }
        .sheet { background: white; max-width: 900px; margin: auto; padding: 50px; border: 1px solid #000; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        .header { text-align: center; font-weight: bold; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin: 0; text-transform: uppercase; }
        .header h2 { font-size: 18px; margin: 5px 0; }
        
        .info-row { margin: 15px 0; font-weight: bold; font-size: 16px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        
        .input-section { background: #f9f9f9; padding: 20px; border: 1px solid #ccc; margin-bottom: 20px; border-radius: 5px; }
        .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #999; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 10px; text-align: center; }
        th { background-color: #eee; }
        
        .btn-container { margin-top: 20px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }
        .btn-save { background: #28a745; color: white; }
        .btn-download { background: #007bff; color: white; }
        
        #previewTable { margin-top: 30px; }
        .preview-header { background: #333; color: white; padding: 10px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>

<div class="sheet">
    <div class="header">
        <h1>Bharat Institute of Engineering and Technology</h1>
        <h2>Department of ECE</h2>
        <h2>Mini Project Batches List (Academic Year 2025-26)</h2>
    </div>

    <div class="info-row">
        Class Incharge: G. Nagarjuna
    </div>

    <div class="input-section">
        <div class="grid-top">
            <div>
                <label>Select Batch:</label>
                <select id="batchNo">
                    <script>
                        for(let i=1; i<=17; i++) document.write(`<option value="Batch-${i}">Batch-${i}</option>`);
                    </script>
                </select>
            </div>
            <div>
                <label>Name of the Guide:</label>
                <input type="text" id="guide" placeholder="Enter Guide Name">
            </div>
        </div>
        <label>Title of the Project:</label>
        <input type="text" id="title" placeholder="Enter Project Title" style="margin-bottom: 15px;">

        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">S.No</th>
                    <th style="width: 30%;">Roll Number</th>
                    <th style="width: 60%;">Name of the Student</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td><input type="text" class="roll" placeholder="Roll No"></td><td><input type="text" class="name" placeholder="Student Name"></td></tr>
                <tr><td>2</td><td><input type="text" class="roll" placeholder="Roll No"></td><td><input type="text" class="name" placeholder="Student Name"></td></tr>
                <tr><td>3</td><td><input type="text" class="roll" placeholder="Roll No"></td><td><input type="text" class="name" placeholder="Student Name"></td></tr>
                <tr><td>4</td><td><input type="text" class="roll" placeholder="Roll No"></td><td><input type="text" class="name" placeholder="Student Name"></td></tr>
            </tbody>
        </table>

        <div class="btn-container">
            <button class="btn btn-save" onclick="addToTable()">Add to Consolidated List</button>
            <button class="btn btn-download" onclick="downloadCSV()">Download Final Excel/CSV</button>
        </div>
    </div>

    <div class="preview-header">Consolidated Batch Preview</div>
    <table id="previewTable">
        <thead>
            <tr>
                <th>Batch</th>
                <th>S.No</th>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Guide</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    let consolidatedData = [];

    function addToTable() {
        const batch = document.getElementById('batchNo').value;
        const guide = document.getElementById('guide').value;
        const title = document.getElementById('title').value;
        const rolls = document.getElementsByClassName('roll');
        const names = document.getElementsByClassName('name');
        const tbody = document.querySelector('#previewTable tbody');

        for (let i = 0; i < 4; i++) {
            if(rolls[i].value === "" || names[i].value === "") continue;

            const row = tbody.insertRow();
            // We only show Batch, Guide, and Title for the first student of the batch to keep it clean
            row.innerHTML = `
                <td>${i === 0 ? batch : ""}</td>
                <td>${i + 1}</td>
                <td>${rolls[i].value}</td>
                <td>${names[i].value}</td>
                <td>${i === 0 ? guide : ""}</td>
                <td>${i === 0 ? title : ""}</td>
            `;
            
            consolidatedData.push({
                batch: i === 0 ? batch : "",
                sno: i + 1,
                roll: rolls[i].value,
                name: names[i].value,
                guide: i === 0 ? guide : "",
                title: i === 0 ? title : ""
            });
        }

        // Clear inputs for next batch
        document.getElementById('guide').value = "";
        document.getElementById('title').value = "";
        for(let i=0; i<4; i++) { rolls[i].value = ""; names[i].value = ""; }
        alert(batch + " added to list!");
    }

    function downloadCSV() {
        let csv = "Batch,S.No,Roll No,Student Name,Guide,Title\n";
        consolidatedData.forEach(row => {
            csv += `"${row.batch}","${row.sno}","${row.roll}","${row.name}","${row.guide}","${row.title}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ECE_Mini_Project_Batches.csv';
        a.click();
    }
</script>

</body>
</html>
