<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE Project Batch Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #0056b3; margin-bottom: 20px; padding-bottom: 10px; }
        h2 { color: #0056b3; margin: 5px 0; }
        .info { font-weight: bold; color: #555; }
        .batch-section { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #004494; }
        .member-title { background: #e9ecef; padding: 5px 10px; margin-bottom: 10px; font-size: 14px; border-left: 4px solid #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Department of ECE</h2>
        <p class="info">Coordinator: G. Nagarjuna</p>
    </div>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        
        <label for="batch">Select Batch Number:</label>
        <select name="Batch_Number" id="batch" required>
            <option value="">-- Select Batch --</option>
            <script>
                for(let i=1; i<=17; i++) {
                    document.write(`<option value="Batch ${i}">Batch ${i}</option>`);
                }
            </script>
        </select>

        <div id="members">
            <script>
                for(let m=1; m<=4; m++) {
                    document.write(`
                        <div class="batch-section">
                            <div class="member-title">Member ${m} Details</div>
                            <div class="grid">
                                <div>
                                    <label>Full Name</label>
                                    <input type="text" name="Member_${m}_Name" placeholder="Enter Name" required>
                                </div>
                                <div>
                                    <label>Roll Number</label>
                                    <input type="text" name="Member_${m}_Roll" placeholder="Enter Roll No" required>
                                </div>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>

        <button type="submit">Submit Batch Details</button>
    </form>
</div>

</body>
</html>
